name: Deploy Nour.OS Workers
on:
  workflow_dispatch:
    inputs:
      target:
        description: Worker to deploy
        required: true
        type: choice
        options:
          - public
          - admin
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Deploy selected Worker
        run: npx wrangler deploy --config ${{ inputs.target == 'admin' && 'wrangler.admin.jsonc' || 'wrangler.jsonc' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
